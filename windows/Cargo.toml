[package]
name = "spokoe-windows"
version = "0.3.1"
edition = "2024"

[[bin]]
name = "Spokoe"
path = "src/main.rs"

[dependencies]
arboard = "3"
cpal = "0.16"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
futures = "0.3"
librespot = { version = "0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
librespot-oauth = { version = "0.8.0", default-features = false, features = ["native-tls"] }
log = "0.4"
open = "5"
protobuf = "=3.7.2"
reqwest = { version = "0.12", features = ["blocking"] }
rfd = "0.15"
serde_json = "1"
souvlaki = "0.8"
tao = "0.34"
tokio = { version = "1", features = ["full"] }
window-vibrancy = "0.6"
wry = "0.53"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
strip = true
