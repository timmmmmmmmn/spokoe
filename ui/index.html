<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draai</title>
<style>/*CSS*/</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <nav id="nav">
      <button data-go="home"><svg><use href="#i-home"/></svg>Home</button>
      <button data-go="search"><svg><use href="#i-search"/></svg>Zoeken<kbd>⌘K</kbd></button>
      <button data-go="library"><svg><use href="#i-lib"/></svg>Bibliotheek</button>
      <button data-go="stats"><svg><use href="#i-stats"/></svg>Statistieken</button>
    </nav>
    <div class="side-head">Playlists</div>
    <div id="side-lists"></div>
    <button id="side-settings" data-go="settings"><svg><use href="#i-gear"/></svg>Instellingen</button>
  </aside>

  <main id="main">
    <header id="top">
      <button class="icon" id="back" title="Terug (⌘[)"><svg><use href="#i-left"/></svg></button>
      <button class="icon" id="fwd" title="Vooruit (⌘])"><svg><use href="#i-right"/></svg></button>
      <div id="top-title"></div>
    </header>
    <div id="view"></div>
  </main>

  <aside id="panel" hidden>
    <div class="panel-head">
      <div class="seg" id="panel-tabs"><button data-p="queue">Wachtrij</button><button data-p="lyrics">Songtekst</button></div>
      <button class="icon" id="panel-close" title="Sluit"><svg><use href="#i-x"/></svg></button>
    </div>
    <div id="panel-body"></div>
  </aside>

  <footer id="bar">
    <div id="np">
      <img id="np-cover" alt="">
      <div id="np-text"><a id="np-title"></a><div id="np-artist"></div></div>
      <button class="icon" id="np-like" title="Vind ik leuk (⌘D)"><svg><use href="#i-heart"/></svg></button>
    </div>
    <div id="ctl">
      <div id="ctl-buttons">
        <button class="icon" id="b-shuffle" title="Shuffle (⌘S)"><svg><use href="#i-shuffle"/></svg></button>
        <button class="icon" id="b-prev" title="Vorige (⌘←)"><svg><use href="#i-prev"/></svg></button>
        <button id="b-play" title="Speel af (spatie)"><svg><use href="#i-play"/></svg></button>
        <button class="icon" id="b-next" title="Volgende (⌘→)"><svg><use href="#i-next"/></svg></button>
        <button class="icon" id="b-repeat" title="Herhaal (⇧⌘R)"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div id="seek"><span id="t-pos">0:00</span><div class="range" id="seek-bar"><div class="fill"></div><div class="knob"></div></div><span id="t-dur">0:00</span></div>
    </div>
    <div id="extra">
      <span id="sleep-badge" hidden></span>
      <button class="icon" id="b-sleep" title="Slaaptimer"><svg><use href="#i-moon"/></svg></button>
      <button class="icon" id="b-lyrics" title="Songtekst (⌘L)"><svg><use href="#i-mic"/></svg></button>
      <button class="icon" id="b-queue" title="Wachtrij (⌘J)"><svg><use href="#i-queue"/></svg></button>
      <button class="icon" id="b-devices" title="Apparaten"><svg><use href="#i-speaker"/></svg></button>
      <div class="range" id="vol"><div class="fill"></div><div class="knob"></div></div>
    </div>
  </footer>
</div>

<div id="login" hidden>
  <div class="login-card">
    <div class="logo"><svg><use href="#i-disc"/></svg></div>
    <h1>Draai</h1>
    <p id="login-msg">Log in met je Spotify Premium-account. Je browser opent even; daarna speelt alles hier op je Mac.</p>
    <button class="primary" id="login-btn">Inloggen met Spotify</button>
  </div>
</div>

<div id="lyrics-full" hidden>
  <div class="lf-bg"></div>
  <button class="icon lf-close" title="Sluit (esc)"><svg><use href="#i-x"/></svg></button>
  <div class="lf-lines"></div>
</div>

<div id="palette" hidden>
  <div class="pal-box">
    <input id="pal-input" placeholder="Zoek een nummer, artiest, album of playlist…" autocomplete="off" spellcheck="false">
    <div id="pal-list"></div>
    <div class="pal-hint"><kbd>↵</kbd> afspelen <kbd>⌥↵</kbd> in wachtrij <kbd>⇧↵</kbd> openen <kbd>esc</kbd> sluiten</div>
  </div>
</div>

<div id="menu" hidden></div>
<div id="toast" hidden></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="m16.5 16.5 4.5 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-lib" viewBox="0 0 24 24"><rect x="3" y="3" width="4" height="18" rx="1.5"/><rect x="9" y="3" width="4" height="18" rx="1.5"/><path d="m15.5 4.2 3.7-1 4 16.6-3.8 1z"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><rect x="3" y="12" width="4.5" height="9" rx="1.5"/><rect x="9.75" y="4" width="4.5" height="17" rx="1.5"/><rect x="16.5" y="8" width="4.5" height="13" rx="1.5"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.6 4.6-.1-2.2 2-1.6-2-3.4-2.4.9a8 8 0 0 0-1.9-1.1L15.8 3h-4l-.4 2.6a8 8 0 0 0-1.9 1.1l-2.4-.9-2 3.4 2 1.6a8 8 0 0 0 0 2.2l-2 1.6 2 3.4 2.4-.9a8 8 0 0 0 1.9 1.1l.4 2.6h4l.4-2.6a8 8 0 0 0 1.9-1.1l2.4.9 2-3.4z"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5.5" y="4" width="4.5" height="16" rx="1.4"/><rect x="14" y="4" width="4.5" height="16" rx="1.4"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 5.2v13.6a.8.8 0 0 0 1.2.7l10-6.8a.8.8 0 0 0 0-1.4l-10-6.8A.8.8 0 0 0 4 5.2z"/><rect x="17" y="4" width="3" height="16" rx="1.2"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M20 5.2v13.6a.8.8 0 0 1-1.2.7l-10-6.8a.8.8 0 0 1 0-1.4l10-6.8a.8.8 0 0 1 1.2.7z"/><rect x="4" y="4" width="3" height="16" rx="1.2"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3.5c2 0 3.2 1 4.3 2.7l2.4 4.6c1 1.7 2.3 2.7 4.3 2.7H21M3 17h3.5c1.3 0 2.3-.4 3.1-1.2M14 8.2c.8-.8 1.8-1.2 3-1.2H21M18 4l3 3-3 3M18 14l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h13M17 3l3 3-3 3M20 13v2a3 3 0 0 1-3 3H4M7 21l-3-3 3-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.7-8-10.8A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8 3.1c0 6.1-8 10.8-8 10.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-heart-on" viewBox="0 0 24 24"><path d="M12 20.5s-8-4.7-8-10.8A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8 3.1c0 6.1-8 10.8-8 10.8z"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M5 19.5 13.5 11M15.5 3.5a5 5 0 1 1 0 10 5 5 0 0 1 0-10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h8M19 14v7M15.5 17.5h7" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-speaker" viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="14.5" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="7" r="1.3"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
  <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="var(--bg)"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="var(--bg)" stroke-width=".6" opacity=".5"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>
<script>//JS</script>
</body>
</html>
