<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotimfy</title>
<style>/*CSS*/</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <nav id="nav">
      <button data-go="home"><svg><use href="#i-home"/></svg>Home</button>
      <button data-go="search"><svg><use href="#i-search"/></svg>Zoeken<kbd>⌘K</kbd></button>
      <button data-go="library"><svg><use href="#i-lib"/></svg>Bibliotheek</button>
      <button data-go="stats"><svg><use href="#i-stats"/></svg>Statistieken</button>
    </nav>
    <div class="side-head">Playlists <button class="icon side-add" id="side-new" title="Nieuwe playlist">+</button></div>
    <div id="side-lists"></div>
    <button id="side-settings" data-go="settings"><svg><use href="#i-gear"/></svg>Instellingen</button>
  </aside>

  <main id="main">
    <header id="top">
      <button class="icon" id="back" title="Terug (⌘[)"><svg><use href="#i-left"/></svg></button>
      <button class="icon" id="fwd" title="Vooruit (⌘])"><svg><use href="#i-right"/></svg></button>
      <div id="top-title"></div>
    </header>
    <div id="view"></div>
  </main>

  <aside id="panel" hidden>
    <div class="panel-head">
      <div class="seg" id="panel-tabs"><button data-p="queue">Wachtrij</button><button data-p="lyrics">Songtekst</button></div>
      <button class="icon" id="panel-close" title="Sluit"><svg><use href="#i-x"/></svg></button>
    </div>
    <div id="panel-body"></div>
  </aside>

  <footer id="bar">
    <div id="np">
      <img id="np-cover" alt="">
      <div id="np-text"><a id="np-title"></a><div id="np-artist"></div></div>
      <button class="icon" id="np-like" title="Vind ik leuk (⌘D)"><svg><use href="#i-heart"/></svg></button>
    </div>
    <div id="ctl">
      <div id="ctl-buttons">
        <button class="icon" id="b-shuffle" title="Shuffle (⌘S)"><svg><use href="#i-shuffle"/></svg></button>
        <button class="icon" id="b-prev" title="Vorige (⌘←)"><svg><use href="#i-prev"/></svg></button>
        <button id="b-play" title="Speel af (spatie)"><svg><use href="#i-play"/></svg></button>
        <button class="icon" id="b-next" title="Volgende (⌘→)"><svg><use href="#i-next"/></svg></button>
        <button class="icon" id="b-repeat" title="Herhaal (⇧⌘R)"><svg><use href="#i-repeat"/></svg></button>
      </div>
      <div id="seek"><span id="t-pos">0:00</span><div class="range" id="seek-bar"><div class="fill"></div><div class="knob"></div><span id="seek-tip" hidden></span></div><span id="t-dur">0:00</span></div>
    </div>
    <div id="extra">
      <span id="sleep-badge" hidden></span>
      <button class="icon" id="b-sleep" title="Slaaptimer"><svg><use href="#i-moon"/></svg></button>
      <button class="icon" id="b-lyrics" title="Songtekst (⌘L)"><svg><use href="#i-mic"/></svg></button>
      <button class="icon" id="b-queue" title="Wachtrij (⌘J)"><svg><use href="#i-queue"/></svg></button>
      <button class="icon" id="b-devices" title="Apparaten"><svg><use href="#i-speaker"/></svg></button>
      <div class="range" id="vol"><div class="fill"></div><div class="knob"></div></div>
      <button class="icon" id="b-mini" title="Minispeler (⌥⌘M)"><svg><use href="#i-mini"/></svg></button>
    </div>
    <button class="icon" id="b-big" title="Groot venster (⌥⌘M)"><svg><use href="#i-big"/></svg></button>
  </footer>
</div>
