# Bij elke push naar main die de app raakt: de Rust-kern voor Android bouwen, een ondertekende APK
# maken en die als release "android-v1.0.N" publiceren. De app vindt die zelf (Updater).
name: android
on:
  push:
    branches: [main]
    paths: ["android/**", "src/**", "ui/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Android SDK 37 en cargo-ndk
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cargo install cargo-ndk --locked

      - name: Ondertekeningssleutel klaarzetten
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/spokoe-release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.SPOKOE_KEYSTORE_BASE64 }}

      - name: APK bouwen
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          ./android/build.sh
        env:
          SPOKOE_KEYSTORE: ${{ runner.temp }}/spokoe-release.jks
          SPOKOE_KEYSTORE_PASSWORD: ${{ secrets.SPOKOE_KEYSTORE_PASSWORD }}
          SPOKOE_KEY_ALIAS: ${{ secrets.SPOKOE_KEY_ALIAS }}
          SPOKOE_KEY_PASSWORD: ${{ secrets.SPOKOE_KEY_PASSWORD }}

      - name: Release publiceren
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Spokoe.apk
          printf '%s\n' "${COMMIT_MSG:-Handmatig gebouwd}" > notes.md
          gh release create "android-v1.0.${{ github.run_number }}" Spokoe.apk \
            --title "Spokoe voor Android 1.0.${{ github.run_number }}" \
            --notes-file notes.md --latest=false
          # Een vaste plek voor de downloadknop op de site: altijd de nieuwste APK.
          gh release upload android-latest Spokoe.apk --clobber \
            || gh release create android-latest Spokoe.apk --title "Spokoe voor Android (nieuwste)" \
                 --notes "Altijd de nieuwste APK. Losse versies staan bij android-v1.0.N." --latest=false
