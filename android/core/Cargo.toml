[package]
name = "spokoe_core"
version = "0.3.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
cpal = "0.16"
futures = "0.3"
jni = "0.21"
librespot = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots", "rodio-backend"] }
librespot-oauth = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
log = "0.4"
android_logger = "0.14"
protobuf = "=3.7.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
opt-level = 3

# Aangepaste librespot-core: op Android als Linux (zie vendor/librespot-core/src/config.rs).
[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }
