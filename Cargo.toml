[package]
name = "spotimfy"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6.2"
dispatch2 = "0.3"
futures = "0.3"
cpal = "0.16"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-media-player = "0.3"
objc2-quartz-core = "0.3.2"
objc2-web-kit = "0.3.2"
librespot = { version = "0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
librespot-oauth = "0.8.0"
log = "0.4"
reqwest = { version = "0.12", features = ["blocking"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
strip = true
